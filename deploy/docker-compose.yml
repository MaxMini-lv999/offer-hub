# 线上部署：MySQL、MongoDB、Redis、后端、Nginx 全部跑在同一台机器的容器里。
# 只有 nginx 对外开 80/443；三个数据库和后端都不映射端口，只在 compose 内部网络里互相访问
# （之前开发库的 MongoDB 无密码暴露在公网被勒索过，线上库一律不对外、全部带密码）。
#
# 密码在同目录的 .env 里（不入库），由 deploy.sh 首次部署时随机生成。
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: offer_hub
      TZ: Asia/Shanghai
    # 这台机器内存只有 3.6G，把缓冲池和 performance_schema 压下来
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --skip-name-resolve
    volumes:
      - mysql_data:/var/lib/mysql
      # 只在数据目录为空（第一次启动）时执行：建 t_user_info
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 600m
    logging: &logging
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?}
      TZ: Asia/Shanghai
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/mongo-init:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 600m
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?}
      - --appendonly
      - "yes"
      - --maxmemory
      - 100mb
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 30
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    mem_limit: 150m
    logging: *logging

  backend:
    build: ./backend
    image: offer-hub-backend:latest
    restart: unless-stopped
    environment:
      APP_ENV: online
      GIN_MODE: release
      TZ: Asia/Shanghai
    volumes:
      - ./config-online.toml:/app/config-online.toml:ro
      # 敏感词库放在宿主机上，改了文件后端会自动热更新，不用重新部署
      - ./sensitive_words.txt:/app/sensitive_words.txt:ro
    depends_on:
      mysql: { condition: service_healthy }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    # 只给宿主机上的 nginx 用，不对外
    ports:
      - "127.0.0.1:8180:8180"
    mem_limit: 300m
    logging: *logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # 用宿主机网络，直接监听 80/443/8443（8443 是 Cloudflare Origin Rule 的回源端口：域名未备案、机房在大陆，
    # 腾讯会拦截 80/443 上未备案域名的访问）。
    # 不用端口映射的原因：这台机器跑着 mihomo TUN，它的策略路由（ip rule 9002 "not from all iif lo lookup 2022"）
    # 把转发流量都送进隧道，容器的回包出不去，外网连映射端口只能看到 SYN、收不到 SYN-ACK。
    # 宿主机网络下 nginx 是本机进程，回包和 sshd 一样走 main 表
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx:/etc/nginx/offer-hub:ro
      - ./certs:/etc/nginx/certs:ro
      - ./frontend-dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    mem_limit: 100m
    logging: *logging

# 固定网段：宿主机 nginx 经 127.0.0.1:8180 访问后端时，docker-proxy 以网关 172.30.0.1 的身份连进来，
# 后端配置里把它设为可信代理（config-online.toml.tmpl 的 trusted_proxies）
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1

volumes:
  mysql_data:
  mongo_data:
  redis_data:
