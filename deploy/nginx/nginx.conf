worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;
    keepalive_timeout 65;
    client_max_body_size 1m;

    # 流量都经过 Cloudflare：只认 Cloudflare 回源地址给的 CF-Connecting-IP，
    # 之后 $remote_addr 就是访客真实 IP，日志和限流都按它来
    include /etc/nginx/offer-hub/cloudflare-ips.conf;
    real_ip_header CF-Connecting-IP;

    # $realip_remote_addr 是 TCP 对端（未被 realip 改写）。不是 Cloudflare 回源的直接拒绝，
    # 防止有人绕过 Cloudflare 直连源站 IP
    geo $realip_remote_addr $from_cf {
        default 0;
        include /etc/nginx/offer-hub/cloudflare-allow.conf;
    }

    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    '$request_time "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 按真实 IP 限流，对齐后端原来的配置：接口每 IP 每分钟约 120 次，登录注册每分钟 10 次
    limit_req_zone $binary_remote_addr zone=api:10m  rate=2r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_status 429;

    # nginx 用宿主机网络，后端端口只映射在宿主机的 127.0.0.1
    upstream backend { server 127.0.0.1:8180; keepalive 16; }

    # 用 IP 或未知域名访问：80 直接断开，443 拒绝 TLS 握手（不暴露证书）
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        listen 8443 ssl default_server;
        ssl_reject_handshake on;
        return 444;
    }

    server {
        listen 80;
        server_name offer-hub.top www.offer-hub.top;
        return 301 https://offer-hub.top$request_uri;
    }

    server {
        listen 443 ssl;
        listen 8443 ssl; # Cloudflare Origin Rule 回源端口，见 docker-compose.yml
        http2 on;
        server_name offer-hub.top www.offer-hub.top;

        # Cloudflare Origin 证书（SSL 模式 Full (strict)）
        ssl_certificate     /etc/nginx/certs/origin.pem;
        ssl_certificate_key /etc/nginx/certs/origin.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Cloudflare 把 http:// 的访问也按明文回源到 8443 时，nginx 报 497，直接跳 https
        error_page 497 =301 https://offer-hub.top$request_uri;

        if ($from_cf = 0) { return 444; }
        if ($host = www.offer-hub.top) { return 301 https://offer-hub.top$request_uri; }

        # 注意 nginx 的 add_header 不会从 server 继承到写了 add_header 的 location，所以每处都 include
        include /etc/nginx/offer-hub/headers.conf;

        # 后端接口前缀和 vite.config.ts 的 proxy 保持一致
        location ~ ^/auth/(login|register)$ {
            limit_req zone=auth burst=5 nodelay;
            include /etc/nginx/offer-hub/proxy_backend.conf;
        }
        location ~ ^/(api|auth|home)(/|$) {
            limit_req zone=api burst=60 nodelay;
            include /etc/nginx/offer-hub/proxy_backend.conf;
        }

        root /usr/share/nginx/html;

        # vite 产物文件名带哈希，可以长缓存
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/offer-hub/headers.conf;
            try_files $uri =404;
        }

        # SPA：前端路由刷新时回落到 index.html；index.html 不缓存，发版后立刻生效
        location / {
            try_files $uri /index.html;
            add_header Cache-Control "no-cache";
            include /etc/nginx/offer-hub/headers.conf;
        }
    }
}
