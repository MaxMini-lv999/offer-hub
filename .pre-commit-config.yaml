# 前后端统一提交检查
# 安装：pipx install pre-commit && pre-commit install（在仓库根目录执行一次）
# 手动全量检查：pre-commit run --all-files
repos:
  # 通用钩子
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md] # Markdown 行尾两个空格是换行，保留
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: detect-private-key

  # 本地钩子：调用前后端各自的工具
  - repo: local
    hooks:
      # lint-staged 会把格式化结果 git add 进暂存区，和 pre-commit 自己的 stash 打架：
      # 同一文件既有已暂存又有未暂存改动时，未暂存的改动会还原失败。
      # 所以跑完把暂存区恢复原样，格式化结果只留在工作区，交给 pre-commit 报
      # "files were modified by this hook"，和 go fmt 等钩子一样：git add 后重新提交
      - id: frontend-lint-staged
        name: frontend lint-staged (prettier + eslint)
        entry: >-
          bash -c 'cd frontend || exit 1;
          tree=$(git write-tree) || exit 1;
          npx --no -- lint-staged; rc=$?;
          git read-tree "$tree"; exit $rc'
        language: system
        files: ^frontend/
        pass_filenames: false

      - id: go-fmt
        name: go fmt
        entry: make -C backend/src fmt
        language: system
        files: ^backend/src/.*\.go$
        pass_filenames: false

      - id: go-vet
        name: go vet
        entry: make -C backend/src vet
        language: system
        files: ^backend/src/.*\.go$
        pass_filenames: false
